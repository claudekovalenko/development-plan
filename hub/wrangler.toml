# Kovalenko Creatives hub: a Worker with static assets, behind Cloudflare Access.
name = "kovalenko-creatives-hub"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Lets src/worker.js import the plans in plans/ as text.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "kovalenko-creatives-hub"
database_id = "1570e160-ff96-4429-bf8a-ebdeac6c2a37"

# Not secrets. Fill in from the Worker's Access settings (see README.md) before deploying.
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
